const vp=document.getElementById('vp'),track=document.getElementById('track'),count=document.getElementById('count');let i=0,sx=0,sy=0,dx=0,dy=0,h=false,drag=false,wa=0,lock=false;function show(n){i=Math.max(0,Math.min(1,n));track.style.transition='transform .32s cubic-bezier(.22,.8,.28,1)';track.style.transform=`translateX(-${i*100}%)`;count.textContent=`${i+1} / 2`;}vp.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;sx=e.touches[0].clientX;sy=e.touches[0].clientY;dx=dy=0;drag=true;h=false},{passive:true});vp.addEventListener('touchmove',e=>{if(!drag||e.touches.length!==1)return;dx=e.touches[0].clientX-sx;dy=e.touches[0].clientY-sy;if(!h&&Math.abs(dx)>10)h=Math.abs(dx)>Math.abs(dy)*1.15;if(h){e.preventDefault();let damp=((i===0&&dx>0)||(i===1&&dx<0))?.28:1;track.style.transition='none';track.style.transform=`translateX(calc(-${i*100}% + ${dx*damp}px))`;}},{passive:false});vp.addEventListener('touchend',()=>{if(!drag)return;drag=false;if(h&&Math.abs(dx)>55)show(dx<0?i+1:i-1);else show(i)});vp.addEventListener('wheel',e=>{let x=Math.abs(e.deltaX)>=Math.abs(e.deltaY)*.85?e.deltaX:0;if(!x||lock)return;wa+=x;if(Math.abs(wa)>65){e.preventDefault();show(wa>0?i+1:i-1);wa=0;lock=true;setTimeout(()=>lock=false,420)}},{passive:false});document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(i+1);if(e.key==='ArrowLeft')show(i-1)});show(0);

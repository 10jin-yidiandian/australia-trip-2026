<style>
:root{--navy:#17324d;--gold:#b8891d;--bg:#eef3f7;--card:#fff;--muted:#687386;--line:#e5e9ef;--paper:#f8f3e8;--water:#cfe8ef;--route:#c94f45}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#172033;background:var(--bg)}
body{overflow:hidden}.app{height:100%;display:flex;flex-direction:column}.top{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex:0 0 auto}
.brand{font-weight:800;color:var(--navy)}.count{font-size:13px;color:var(--muted)}
.viewport{position:relative;flex:1;overflow:hidden}.track{height:100%;display:flex;transition:transform .3s ease}
.page{min-width:100%;height:100%;overflow-y:auto;padding:16px 14px 92px}
.hero,.card{background:var(--card);border-radius:20px;box-shadow:0 8px 24px rgba(23,50,77,.07)}
.hero{padding:20px 18px;margin-bottom:12px;background:linear-gradient(145deg,#fff,#f9f6ef)}
.date{font-size:13px;color:var(--gold);font-weight:800}.title{font-size:27px;font-weight:850;color:var(--navy);margin:5px 0}.sub{font-size:14px;color:var(--muted)}
.card{padding:8px 16px;margin-bottom:12px}.row{display:grid;grid-template-columns:92px 1fr;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}
.time{font-size:13px;font-weight:800;color:var(--gold);line-height:1.4}.name{font-weight:750;color:var(--navy);margin-bottom:3px}.note{font-size:13px;color:var(--muted);line-height:1.5}
.mapWrap{padding:10px}.mapTitle{font-weight:800;color:var(--navy);padding:4px 6px 10px}.sketch{width:100%;border-radius:14px;overflow:hidden;background:var(--paper);border:1px solid #eadfcb}
.sketch svg{width:100%;height:auto;display:block}.mapActions{display:flex;justify-content:flex-end;padding:9px 4px 1px}
.realmap{display:inline-flex;align-items:center;gap:6px;padding:8px 11px;border-radius:999px;background:#f2f6f9;color:#1b5f87;text-decoration:none;font-size:12px;font-weight:700}
.nav{position:absolute;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 14px 12px}
.btn{width:42px;height:42px;border:0;border-radius:50%;background:var(--navy);color:white;font-size:21px}.btn:disabled{opacity:.2}.dots{flex:1;display:flex;justify-content:center;gap:6px}.dot{width:7px;height:7px;border-radius:50%;background:#cbd5e1}.dot.active{background:var(--gold);transform:scale(1.25)}
@media(min-width:850px){.page{padding:22px max(18px,calc((100vw - 920px)/2)) 100px}}
</style>
</head>
<body>

    <div class="nav"><button class="btn" id="prev">‹</button><div class="dots" id="dots"></div><button class="btn" id="next">›</button></div>
  </div>
</div>

function sketchSVG(day){
 const W=720,H=410,pad=72, pts=day.pts;
 if(day.style==="split"){
   return '<svg viewBox="0 0 720 410" xmlns="http://www.w3.org/2000/svg"><rect width="720" height="410" fill="#f8f3e8"/><rect x="24" y="24" width="320" height="362" rx="24" fill="#fffaf0" stroke="#dfd3bf"/><rect x="376" y="24" width="320" height="362" rx="24" fill="#fffaf0" stroke="#dfd3bf"/><text x="54" y="66" font-size="18" font-weight="700" fill="#17324d">悉尼</text><text x="406" y="66" font-size="18" font-weight="700" fill="#17324d">墨尔本</text><path d="M155 192 C270 106 420 106 540 190" fill="none" stroke="#c94f45" stroke-width="4" stroke-dasharray="8 9"/><path d="M510 174 l30 16 -30 16" fill="#c94f45"/><circle cx="155" cy="192" r="18" fill="#17324d" stroke="#fff" stroke-width="4"/><text x="155" y="198" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text><text x="155" y="232" text-anchor="middle" font-size="14" fill="#17324d">悉尼机场</text><path d="M395 245 C455 205 520 212 590 250" fill="none" stroke="#c94f45" stroke-width="4" stroke-dasharray="7 8"/><circle cx="432" cy="246" r="18" fill="#17324d" stroke="#fff" stroke-width="4"/><text x="432" y="252" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text><text x="432" y="280" text-anchor="middle" font-size="13" fill="#17324d">Southbank</text><circle cx="575" cy="248" r="18" fill="#17324d" stroke="#fff" stroke-width="4"/><text x="575" y="254" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text><text x="575" y="282" text-anchor="middle" font-size="13" fill="#17324d">雅拉河</text><path d="M390 314 C455 292 530 334 676 310" fill="none" stroke="#9fd2df" stroke-width="20" stroke-linecap="round" opacity=".75"/></svg>';
 }
 let minLat=Math.min(...pts.map(p=>p[2])),maxLat=Math.max(...pts.map(p=>p[2])),minLon=Math.min(...pts.map(p=>p[3])),maxLon=Math.max(...pts.map(p=>p[3]));
 if(maxLat-minLat<0.006){maxLat+=0.003;minLat-=0.003} if(maxLon-minLon<0.006){maxLon+=0.003;minLon-=0.003}
 const xy=pts.map(p=>[p[0],p[1],pad+(p[3]-minLon)/(maxLon-minLon)*(W-2*pad),H-pad-(p[2]-minLat)/(maxLat-minLat)*(H-2*pad)]);
 const route=xy.map((p,i)=>(i?'L':'M')+p[2].toFixed(1)+' '+p[3].toFixed(1)).join(' ');
 let water='';
 if(day.style==="harbour") water='<path d="M0 300 C140 250 210 360 345 318 C480 275 555 335 720 270 L720 410 L0 410Z" fill="#cfe8ef"/>';
 if(day.style==="ferry") water='<rect y="180" width="720" height="230" fill="#cfe8ef"/><path d="M0 190 C140 150 300 230 430 180 C555 135 625 190 720 150" fill="none" stroke="#a8d6e0" stroke-width="8"/>';
 if(day.style==="river") water='<path d="M0 315 C150 270 265 350 380 310 C505 267 585 328 720 288" fill="none" stroke="#b7dee6" stroke-width="26" stroke-linecap="round"/>';
 if(day.style==="coast") water='<path d="M530 0 C480 110 555 180 500 275 C470 330 520 370 490 410 L720 410 L720 0Z" fill="#cfe8ef"/>';
 if(day.style==="airport") water='<path d="M0 340 C170 300 300 370 470 330 C570 306 640 320 720 300 L720 410 L0 410Z" fill="#dcecf0"/>';
 const streets='<g stroke="#dfd7c9" stroke-width="2" opacity=".65"><path d="M80 80 L650 290"/><path d="M110 320 L615 85"/><path d="M220 45 L300 370"/><path d="M465 45 L415 372"/></g>';
 const dots=xy.map((p,i)=>{
   const anchor=i%2===0?'start':'end', dx=i%2===0?23:-23;
   return '<circle cx="'+p[2]+'" cy="'+p[3]+'" r="18" fill="#17324d" stroke="#fff" stroke-width="4"/><text x="'+p[2]+'" y="'+(p[3]+5)+'" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">'+p[0]+'</text><text x="'+(p[2]+dx)+'" y="'+(p[3]-23)+'" text-anchor="'+anchor+'" font-size="13" font-weight="600" fill="#17324d">'+p[1]+'</text>';
 }).join('');
 return '<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg"><rect width="'+W+'" height="'+H+'" fill="#f8f3e8"/>'+water+streets+'<path d="'+route+'" fill="none" stroke="#c94f45" stroke-width="4" stroke-dasharray="8 8" stroke-linecap="round" stroke-linejoin="round"/>'+dots+'<text x="22" y="34" font-size="12" fill="#8a7e6b">当天路线示意 · 按编号顺序</text></svg>';
}

const track=document.getElementById("track"),dots=document.getElementById("dots"),count=document.getElementById("count");
days.forEach((x,i)=>{
 const sec=document.createElement("section");sec.className="page";sec.innerHTML=
 '<div class="hero"><div class="date">'+x.d+' · '+x.city+'</div><div class="title">'+x.title+'</div><div class="sub">'+x.sub+'</div></div>'+
 '<div class="card">'+x.items.map(r=>'<div class="row"><div class="time">'+r[0]+'</div><div><div class="name">'+r[1]+'</div><div class="note">'+r[2]+'</div></div></div>').join("")+'</div>'+
 '<div class="card mapWrap"><div class="mapTitle">当天手绘地图</div><div class="sketch">'+sketchSVG(x)+'</div><div class="mapActions"><a class="realmap" href="'+x.real+'" target="_blank" rel="noopener">↗ 查看真实地图</a></div></div>';
 track.appendChild(sec);let d=document.createElement("span");d.className="dot";d.onclick=()=>{idx=i;render()};dots.appendChild(d);
});
let idx=0,startX=0,dx=0;
function render(){
 track.style.transform='translateX(-'+(idx*100)+'%)';count.textContent=(idx+1)+' / '+days.length;
 document.getElementById("prev").disabled=idx===0;document.getElementById("next").disabled=idx===days.length-1;
 [...dots.children].forEach((d,i)=>d.classList.toggle("active",i===idx));
}
document.getElementById("prev").onclick=()=>{if(idx>0){idx--;render()}};
document.getElementById("next").onclick=()=>{if(idx<days.length-1){idx++;render()}};
const vp=document.getElementById("vp");
vp.addEventListener("touchstart",e=>{startX=e.touches[0].clientX;dx=0},{passive:true});
vp.addEventListener("touchmove",e=>{dx=e.touches[0].clientX-startX},{passive:true});
vp.addEventListener("touchend",()=>{if(Math.abs(dx)>55){if(dx<0&&idx<days.length-1)idx++;if(dx>0&&idx>0)idx--;render()}});
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight"&&idx<days.length-1){idx++;render()}if(e.key==="ArrowLeft"&&idx>0){idx--;render()}});
render();
</script>

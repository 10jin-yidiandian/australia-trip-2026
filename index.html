const track=document.getElementById("track"),dots=document.getElementById("dots"),count=document.getElementById("count");
days.forEach((x,i)=>{const sec=document.createElement("section");sec.className="page";sec.innerHTML=
'<div class="hero"><div class="date">'+x.d+' · '+x.city+'</div><div class="title">'+x.title+'</div><div class="sub">'+x.sub+'</div></div>'+
'<div class="card">'+x.items.map(r=>'<div class="row"><div class="time">'+r[0]+'</div><div><div class="name">'+r[1]+'</div><div class="note">'+r[2]+'</div></div></div>').join("")+'</div>'+
'<div class="card mapWrap"><div class="mapTitle">当天手绘地图</div><img class="mapImg" data-src="'+x.src+'" alt="'+x.d+' 手绘地图"><div class="mapActions"><a class="realmap" href="'+x.real+'" target="_blank" rel="noopener">↗ 查看真实地图</a></div></div>';
track.appendChild(sec);let d=document.createElement("span");d.className="dot";d.onclick=()=>{idx=i;render()};dots.appendChild(d);});
let idx=0,startX=0,dx=0;
function loadNear(){[idx-1,idx,idx+1].forEach(i=>{if(i>=0&&i<days.length){const im=track.children[i].querySelector(".mapImg");if(!im.src) im.src=im.dataset.src;}})}
function render(){track.style.transform='translateX(-'+(idx*100)+'%)';count.textContent=(idx+1)+' / '+days.length;document.getElementById("prev").disabled=idx===0;document.getElementById("next").disabled=idx===days.length-1;[...dots.children].forEach((d,i)=>d.classList.toggle("active",i===idx));loadNear();}
document.getElementById("prev").onclick=()=>{if(idx>0){idx--;render()}};document.getElementById("next").onclick=()=>{if(idx<days.length-1){idx++;render()}};
const vp=document.getElementById("vp");vp.addEventListener("touchstart",e=>{startX=e.touches[0].clientX;dx=0},{passive:true});vp.addEventListener("touchmove",e=>{dx=e.touches[0].clientX-startX},{passive:true});vp.addEventListener("touchend",()=>{if(Math.abs(dx)>55){if(dx<0&&idx<days.length-1)idx++;if(dx>0&&idx>0)idx--;render()}});
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight"&&idx<days.length-1){idx++;render()}if(e.key==="ArrowLeft"&&idx>0){idx--;render()}});render();
</script></body></html>
